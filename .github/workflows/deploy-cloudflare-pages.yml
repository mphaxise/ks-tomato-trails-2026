name: Deploy Tracker Pages to Cloudflare

on:
  push:
    branches:
      - master
    paths:
      - 'tracker/**'
      - 'scripts/build_experiment_trails_page.py'
      - 'scripts/build_tomato_pot_mapping.py'
      - 'scripts/build_tomato_trails_page.py'
      - 'scripts/build_non_tomato_snapshot_page.py'
      - 'scripts/build_experiment_trails_label_editor_page.py'
      - 'scripts/build_v14_cv_research_page.py'
      - 'scripts/v14_cv_research_pipeline.py'
      - 'scripts/v14_cv_calibration_check.py'
      - 'data/intake/google_photos/manual_mixed_photos_labeled_v3.csv'
      - 'data/intake/google_photos/manual_non_tomato_labeled_v3.csv'
      - 'data/intake/google_photos/manual_tomato_series_map.csv'
      - 'data/intake/google_photos/manual_tomato_pot_series_overrides.csv'
      - 'data/intake/processed/tomato_pot_mapping_latest.csv'
      - 'data/intake/processed/tomato_pot_mapping_report_latest.json'
      - 'data/research/v1_4/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - '.github/workflows/release-snapshot-guard.yml'
      - 'wrangler.jsonc'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild tracker pages
        run: npm run build:tracker

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy tracker --project-name ks-tomato-trails-2026 --branch master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
